[package]
name = "r3-claim-harness"
version = "1.0.0"
edition = "2021"
license = "BSL-1.1"
description = "IGT 物理小脑 R4 模型臂（local-cli）：读锚包 → 构造 prompt → 调 llama.cpp → 产出 ClaimForCheck"

[dependencies]
serde = { version = "1", features = ["derive"] }
